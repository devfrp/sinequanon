[package]
name = "sinequanon"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Sine qua non — traceur de courbes, réécriture indépendante en Rust (cœur v0.1)"
license = "MIT"
authors = ["devfrp"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
